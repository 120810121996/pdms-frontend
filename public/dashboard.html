<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDMS — Tableau de bord</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">📋</div>
      <span class="logo-text">PDMS</span>
    </div>
    <div class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-page="dashboard"><span class="nav-icon">🏠</span>Tableau de bord</a>
      <a href="/projects" class="nav-item" data-page="projects"><span class="nav-icon">📁</span>Mes Projets</a>
      <div class="nav-label admin-only">Administration</div>
      <a href="/admin" class="nav-item admin-only" data-page="admin"><span class="nav-icon">⚙️</span>Utilisateurs</a>
    </div>
    <div class="sidebar-footer">
      <div class="avatar" id="sidebarAvatar">A</div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">…</div>
        <div class="user-role" id="sidebarRole">…</div>
      </div>
      <button class="btn-logout" id="logoutBtn" title="Déconnexion">↪</button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="welcomeTitle">Bonjour 👋</h1>
        <p class="page-sub">Vue d'ensemble de votre activité</p>
      </div>
      <a href="/projects" class="btn btn-primary">+ Nouveau projet</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat c-indigo"><div class="stat-icon">📁</div><div class="stat-value" id="sProj">—</div><div class="stat-label">Projets actifs</div></div>
      <div class="stat c-blue"><div class="stat-icon">📄</div><div class="stat-value" id="sDocs">—</div><div class="stat-label">Documents</div></div>
      <div class="stat c-yellow"><div class="stat-icon">✅</div><div class="stat-value" id="sTasks">—</div><div class="stat-label">Tâches totales</div></div>
      <div class="stat c-green"><div class="stat-icon">🎯</div><div class="stat-value" id="sDone">—</div><div class="stat-label">Tâches terminées</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px" id="mainGrid">
      <!-- Recent projects -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📁 Projets récents</span>
          <a href="/projects" class="btn btn-secondary btn-sm">Voir tout</a>
        </div>
        <div id="recentProjects"><div class="loader"><div class="spinner"></div></div></div>
      </div>

      <!-- Upcoming tasks -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">⏰ Tâches à venir</span>
        </div>
        <div id="upcomingTasks"><div class="loader"><div class="spinner"></div></div></div>
      </div>
    </div>
  </main>
</div>

<!-- Confirm dialog -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" style="max-width:380px">
    <div class="confirm-icon">⚠️</div>
    <h3 class="modal-title text-center" id="confirmTitle">Confirmer</h3>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="confirmCancel">Annuler</button>
      <button class="btn btn-danger" id="confirmOk">Confirmer</button>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script>
  if (!requireAuth()) throw new Error('unauth');
  setupSidebar('dashboard');

  const user = getUser();
  document.getElementById('welcomeTitle').textContent = `Bonjour, ${user.name} 👋`;

  async function loadDashboard() {
    try {
      const [projects, upcoming] = await Promise.all([
        api('/projects'),
        api('/tasks/upcoming')
      ]);

      // Stats
      const active = projects.filter(p => p.status === 'active').length;
      const docs = projects.reduce((a, p) => a + (p.doc_count || 0), 0);
      const tasks = projects.reduce((a, p) => a + (p.task_count || 0), 0);
      const done = projects.reduce((a, p) => a + (p.done_count || 0), 0);
      document.getElementById('sProj').textContent = active;
      document.getElementById('sDocs').textContent = docs;
      document.getElementById('sTasks').textContent = tasks;
      document.getElementById('sDone').textContent = done;

      // Recent projects (last 4)
      const recent = projects.slice(0, 4);
      const rpEl = document.getElementById('recentProjects');
      if (!recent.length) {
        rpEl.innerHTML = `<div class="empty"><span class="empty-icon">📁</span><h3>Aucun projet</h3><p>Créez votre premier projet !</p><a href="/projects" class="btn btn-primary btn-sm">Créer un projet</a></div>`;
      } else {
        rpEl.innerHTML = recent.map(p => `
          <a href="/project/${p.id}" class="doc-item" style="text-decoration:none;color:inherit;display:flex;margin-bottom:8px">
            <div style="width:10px;height:10px;border-radius:50%;background:${p.color};flex-shrink:0;margin-top:4px;margin-right:12px"></div>
            <div style="flex:1;min-width:0">
              <div class="font-bold text-sm truncate">${p.name}</div>
              <div style="margin-top:4px">
                <div class="progress-bar" style="height:4px"><div class="progress-fill" style="width:${p.progress}%"></div></div>
              </div>
            </div>
            <div class="text-xs text-muted" style="margin-left:12px;flex-shrink:0">${p.progress}%</div>
          </a>`).join('');
      }

      // Upcoming tasks
      const utEl = document.getElementById('upcomingTasks');
      if (!upcoming.length) {
        utEl.innerHTML = `<div class="empty"><span class="empty-icon">🎉</span><h3>Aucune tâche urgente</h3><p>Tout est à jour !</p></div>`;
      } else {
        utEl.innerHTML = upcoming.map(t => `
          <div class="task-item" style="margin-bottom:8px">
            <div class="status-btn ${t.status}"></div>
            <div class="task-body">
              <div class="task-title ${t.status === 'done' ? 'done' : ''}">${t.title}</div>
              <div class="task-meta">
                <span class="badge badge-${t.priority}">${priorityLabel(t.priority)}</span>
                <a href="/project/${t.project_id}" style="font-size:.75rem;color:var(--t3);text-decoration:none">📁 ${t.project_name}</a>
                ${t.due_date ? `<span class="${dueCls(t.due_date, t.status)}">📅 ${relDate(t.due_date)}</span>` : ''}
              </div>
            </div>
          </div>`).join('');
      }
    } catch(e) { toast(e.message, 'error'); }
  }

  loadDashboard();

  // Responsive sidebar
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('sidebar').classList.remove('open');
  });
</script>
</body>
</html>
